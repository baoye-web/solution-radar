name: 现成方案雷达 · 每日更新

on:
  schedule:
    # GitHub Actions cron 用 UTC。每天 01:47 UTC = 北京时间 09:47
    # 刻意避开整点：整点是所有人的默认值，排队更稳
    - cron: '47 1 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: radar-daily
  cancel-in-progress: false

env:
  PYTHONIOENCODING: utf-8

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 采集
        env:
          GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
        run: |
          python3 radar/fetch.py \
            --topics "ai-agent,mcp-server,llm-agent" \
            --min-stars 800 \
            --pages 2 --per-page 30 \
            --check-releases \
            --out data/raw.json

      - name: 评分
        run: python3 radar/score.py --in data/raw.json --out data/entries.json --limit 60

      - name: 发布
        run: python3 radar/publish.py --in data/entries.json --outdir docs --reports reports --limit 24

      - name: 生成分发文案
        run: python3 radar/distribute.py --in data/entries.json --out out --pick 6

      - name: 提交
        if: always()
        run: |
          git config user.name  "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "chore: 雷达清单与分发文案每日更新"
            git push origin "HEAD:${{ github.ref_name }}"
          fi

  # Pages 独立成 job：只有内容变了才重新部署，避免无谓的部署记录
  deploy:
    needs: update
    if: needs.update.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: '${{ steps.deployment.outputs.page_url }}'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: 上传站点
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs
      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v4

  # 失败时把原始数据留在 artifact 里，方便事后排查而不是"什么都没发生"
  salvage:
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 上传现场
        uses: actions/upload-artifact@v4
        with:
          name: radar-debug
          path: |
            data/
            reports/
          retention-days: 7
